services:
  surfpool:
    image: surfpool/surfpool:1.1.1
    container_name: surfpool
    command: >
      start
      --no-tui
      --host 0.0.0.0
      --port 8899
      --ws-port 8900
    ports:
      - "8899:8899"
      - "8900:8900"
      - "18488:18488"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8899' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - protochain

  protochain-solana-api:
    image: ghcr.io/meshtrade/protochain/protochain-solana-api:1.3.0
    container_name: protochain-solana-api
    ports:
      - "50064:50064"
    environment:
      SOLANA_RPC_URL: http://surfpool:8899
      SOLANA_WEBSOCKET_URL: ws://surfpool:8900
      SOLANA_TIMEOUT_SECONDS: 30
      SOLANA_RETRY_ATTEMPTS: 3
      SOLANA_HEALTH_CHECK_ON_STARTUP: "true"
      ENVOY_ADDRESS: 0.0.0.0
      ENVOY_PORT: 50064
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: 50051
      RUST_LOG: info,protochain_solana_api=info
      PROTOCHAIN_JSON_LOGS: "true"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/50064' 2>/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      surfpool:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - protochain

  protochain-solana-dashboard:
    image: ghcr.io/meshtrade/protochain/protochain-solana-dashboard:latest
    container_name: protochain-solana-dashboard
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOSTNAME: 0.0.0.0
    depends_on:
      protochain-solana-api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - protochain

networks:
  protochain:
    driver: bridge
