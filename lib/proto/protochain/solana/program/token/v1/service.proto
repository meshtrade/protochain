syntax = "proto3";

package protochain.solana.program.token.v1;

import "protochain/solana/program/token/v1/spl_token_metadata.proto";
import "protochain/solana/program/token/v1/token2022_extension.proto";
import "protochain/solana/transaction/v1/instruction.proto";
import "protochain/solana/type/v1/token_program.proto";

option go_package = "github.com/meshtrade/protochain/lib/go/protochain/solana/program/token/v1;token_v1";

// Token Program service for creating SPL Token and Token-2022 instructions
service Service {
  // Creates initialisation instructions for a Token-2022 mint with optional extensions.
  // The instruction sequence depends on the requested extensions.
  // With the Metadata extension the order is:
  //   metadata_pointer_init → initialize_mint → token_metadata_init → update_field × N
  // Without extensions only initialize_mint is returned.
  rpc InitialiseToken2022Mint(InitialiseToken2022MintRequest) returns (InitialiseToken2022MintResponse);

  // Creates a single initialise_mint instruction for the legacy SPL Token program.
  // Extensions are not supported.
  rpc InitialiseSPLTokenMint(InitialiseSPLTokenMintRequest) returns (InitialiseSPLTokenMintResponse);

  // Returns the minimum rent-exempt balance (in lamports) and the required account
  // space (in bytes) for a Token-2022 mint account with the requested extensions.
  //
  // The returned space covers the base mint layout and fixed-size extension pods
  // (e.g. MetadataPointer) needed by System::CreateAccount.
  //
  // The returned lamports cover the **full** final account size — including
  // variable-length metadata content that Token-2022 allocates via realloc
  // during initialize_token_metadata — so the account remains rent-exempt after
  // resizing. Pass both values directly to System::CreateAccount.
  //
  // Provide the same extension set you intend to pass to InitialiseToken2022Mint
  // so that the returned values are consistent.
  rpc GetCurrentMinRentForToken2022MintAccount(GetCurrentMinRentForToken2022MintAccountRequest) returns (GetCurrentMinRentForToken2022MintAccountResponse);

  // Returns the minimum rent-exempt balance (in lamports) and the required account
  // space (in bytes) for a legacy SPL Token mint account.
  //
  // Legacy SPL Token mints are always exactly Mint::LEN (82 bytes) with no
  // extension support, so no additional parameters are needed.
  rpc GetCurrentMinRentForSPLTokenMintAccount(GetCurrentMinRentForSPLTokenMintAccountRequest) returns (GetCurrentMinRentForSPLTokenMintAccountResponse);

  // Parses mint account data into structured format
  rpc ParseMint(ParseMintRequest) returns (ParseMintResponse);

  // Gets current minimum rent for a token holding account, optionally accounting for memo transfer extension size when memo_transfer_config is provided.
  rpc GetCurrentMinRentForHoldingAccount(GetCurrentMinRentForHoldingAccountRequest) returns (GetCurrentMinRentForHoldingAccountResponse);

  // Creates both system account creation and mint initialization instructions. Memo transfer is not applicable to mint accounts.
  rpc CreateMint(CreateMintRequest) returns (CreateMintResponse);

  // Creates holding account initialization instructions. Adds memo-enable instruction when requested.
  rpc CreateHoldingAccount(CreateHoldingAccountRequest) returns (CreateHoldingAccountResponse);

  // Mint tokens to an existing token account using MintToChecked instruction
  rpc Mint(MintRequest) returns (MintResponse);
}

// Request to initialise a Token-2022 mint with optional extensions.
message InitialiseToken2022MintRequest {
  // The public key of the Mint account to be initialized.
  string mint_pub_key = 1;

  // The authority that can mint new tokens.
  string mint_authority_pub_key = 2;

  // Optional authority that can freeze token accounts.
  string freeze_authority_pub_key = 3;

  // Number of base 10 digits to the right of the decimal place.
  // Common values: 9 for SOL-like tokens, 6 for USDC-like tokens, 0 for NFTs.
  uint32 decimals = 4;

  // Ordered list of extensions to enable on the mint.
  // NOTE: If an extension is not included here during initialization,
  // it cannot be added to the mint account later.
  repeated protochain.solana.program.token.v1.Token2022Extension extensions = 5;
}

// Response containing Token-2022 InitialiseMint instructions.
// Multiple instructions are returned when extensions are requested
// (e.g. metadata pointer initialisation precedes initialize_mint,
// and token-metadata initialisation follows it).
message InitialiseToken2022MintResponse {
  repeated protochain.solana.transaction.v1.SolanaInstruction instructions = 1;
}

// Request to initialise a legacy SPL Token mint.
message InitialiseSPLTokenMintRequest {
  // The public key of the Mint account to be initialized.
  string mint_pub_key = 1;

  // The authority that can mint new tokens.
  string mint_authority_pub_key = 2;

  // Optional authority that can freeze token accounts.
  string freeze_authority_pub_key = 3;

  // Number of base 10 digits to the right of the decimal place.
  // Common values: 9 for SOL-like tokens, 6 for USDC-like tokens, 0 for NFTs.
  uint32 decimals = 4;

  // The public key of the account paying for the Metaplex metadata PDA creation.
  // Required when metadata is provided.
  string payer_pub_key = 5;

  // Optional Metaplex metadata to attach to the mint via the Metaplex Token Metadata program.
  // When provided, a CreateMetadataAccountV3 instruction is appended after initialize_mint.
  optional MetaplexTokenMetadata metadata = 6;
}

// Response containing SPL Token initialise_mint instructions.
// When metadata is requested, additional Metaplex instructions follow the base initialize_mint.
message InitialiseSPLTokenMintResponse {
  repeated protochain.solana.transaction.v1.SolanaInstruction instructions = 1;
}

// Request for the minimum rent and space required for a Token-2022 mint account.
// Provide the same extension set you intend to pass to InitialiseToken2022Mint so that
// the returned lamports and space values are consistent with each other.
message GetCurrentMinRentForToken2022MintAccountRequest {
  // Ordered list of extensions to enable on the mint.
  // Must match the extensions you will pass to InitialiseToken2022Mint.
  // If empty, results are based on a base Token-2022 mint with no extensions.
  // Duplicates are rejected.
  repeated protochain.solana.program.token.v1.Token2022Extension extensions = 1;
}

// Rent and space for a Token-2022 mint account with the requested extensions.
// Pass both fields directly to the System Program's CreateAccount instruction
// before calling InitialiseToken2022Mint.
message GetCurrentMinRentForToken2022MintAccountResponse {
  // Minimum lamports required for the account to be rent-exempt after all
  // extensions (including variable-length metadata) are fully initialised.
  uint64 lamports = 1;

  // Initial account size in bytes for System::CreateAccount.
  // Covers the base mint layout and fixed-size extension pods only.
  uint64 space = 2;
}

// Request for the minimum rent and space required for a legacy SPL Token mint account.
// No parameters are needed because SPL Token mints are always exactly Mint::LEN (82 bytes).
message GetCurrentMinRentForSPLTokenMintAccountRequest {}

// Rent and space for a legacy SPL Token mint account.
// Pass both fields directly to the System Program's CreateAccount instruction
// before calling InitialiseSPLTokenMint.
message GetCurrentMinRentForSPLTokenMintAccountResponse {
  // Minimum lamports required for the account to be rent-exempt.
  uint64 lamports = 1;

  // Account size in bytes to allocate (always Mint::LEN = 82 bytes).
  uint64 space = 2;
}

// Request to parse mint account
message ParseMintRequest {
  string account_address = 1;
}

// Response with parsed mint data.
message ParseMintResponse {
  // Base mint account fields (authority, decimals, supply, etc.).
  MintInfo mint = 1;

  // The token program that owns this mint account (Legacy SPL Token or Token-2022).
  protochain.solana.type.v1.TokenProgram token_program = 2;

  // Extensions present on the mint account.
  // Only populated for Token-2022 mints that have extensions configured.
  repeated protochain.solana.program.token.v1.Token2022Extension extensions = 3;
}

// Structured mint account information
message MintInfo {
  string mint_authority_pub_key = 1;
  string freeze_authority_pub_key = 2;
  uint32 decimals = 3;
  string supply = 4;
  bool is_initialized = 5;
}

message MemoTransferConfig {
  // Require every inbound transfer into the account to include a memo.
  bool require_incoming_memo = 1;
}

// Request to get current rent for holding account
message GetCurrentMinRentForHoldingAccountRequest {
  MemoTransferConfig memo_transfer_config = 1; // optional, defaults to false
}

// Response with current rent amount for holding account
message GetCurrentMinRentForHoldingAccountResponse {
  uint64 lamports = 1;
}

// Request to create and initialize a holding account in one call
message CreateHoldingAccountRequest {
  string payer = 1; // Account paying for creation (signer)
  string owner_pub_key = 2; // Owner of the holding account
  string mint_pub_key = 3; // Mint this account will hold
  protochain.solana.type.v1.TokenProgram token_program = 4;
  MemoTransferConfig memo_transfer_config = 5; // optional, defaults to false
}

// Response containing both create and initialize instructions
message CreateHoldingAccountResponse {
  repeated protochain.solana.transaction.v1.SolanaInstruction instructions = 1;
}

// Request to create and initialize a mint account in one call
message CreateMintRequest {
  // System program create fields
  string payer = 1; // Account paying for creation (signer)

  // Token program initialize mint fields
  string mint_pub_key = 2; // Same as new_account for validation
  string mint_authority_pub_key = 3; // Mint authority
  string freeze_authority_pub_key = 4; // Freeze authority (optional)
  uint32 decimals = 5; // Mint decimals
  protochain.solana.type.v1.TokenProgram token_program = 6;
}

// Response containing both create and initialize instructions
message CreateMintResponse {
  repeated protochain.solana.transaction.v1.SolanaInstruction instructions = 1;
}

// Request to mint tokens to a token account
message MintRequest {
  string mint_pub_key = 1; // The mint to mint from
  string destination_account_pub_key = 2; // Token account to mint to
  string mint_authority_pub_key = 3; // Authority that can mint tokens
  string amount = 4; // Amount to mint (as string to handle large numbers)
  uint32 decimals = 5; // Expected decimals for validation
}

// Response containing Mint instruction
message MintResponse {
  protochain.solana.transaction.v1.SolanaInstruction instruction = 1;
}
