name: Publish TypeScript SDK to npm via OIDC Trusted Publishing

# Triggers on tags like ts-sdk/v1.0.0, ts-sdk/v2.1.3, etc.
# Uses npm Trusted Publishing (OIDC) - no long-lived tokens required!
# Requires npm CLI >= 11.5.1 and one-time trusted publisher config on npmjs.com
on:
  push:
    tags:
      - 'ts-sdk/v*.*.*'

  # Allows manual workflow dispatch
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.2.3)'
        required: true
        type: string

permissions:
  contents: write  # For committing version changes back to repository
  id-token: write  # CRITICAL: Required for OIDC authentication with npm
  pull-requests: write  # For creating PR after successful deployment

jobs:
  npm-deploy:
    runs-on: ubuntu-latest  # Must use GitHub-hosted runner (self-hosted not supported for OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'  # Required for OIDC authentication

      - name: Upgrade npm to support OIDC
        run: |
          echo "Current npm version: $(npm --version)"
          npm install -g npm@latest
          echo "Updated npm version: $(npm --version)"
          echo "Note: OIDC requires npm >= 11.5.1"

      - name: Enable Corepack
        run: corepack enable

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            .yarn/cache
            lib/ts/node_modules
          key: ${{ runner.os }}-ts-sdk-deps-${{ hashFiles('yarn.lock', 'lib/ts/package.json') }}
          restore-keys: |
            ${{ runner.os }}-ts-sdk-deps-

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup buf CLI (required for protobuf generation)
        uses: bufbuild/buf-setup-action@v1
        with:
          github_token: ${{ github.token }}

      - name: Generate TypeScript code from protobuf
        run: ./scripts/code-gen/generate/all.sh

      - name: Run TypeScript linting
        working-directory: ./lib/ts
        run: |
          echo "🔍 Linting TypeScript code..."
          yarn lint

      - name: Run TypeScript type checking
        working-directory: ./lib/ts
        run: |
          echo "🧪 Type checking TypeScript..."
          yarn typecheck

      - name: Extract version from tag or input
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Extract version from ts-sdk/v*.*.* tag (e.g., ts-sdk/v1.2.3 -> 1.2.3)
            VERSION=$(echo "${{ github.ref_name }}" | sed 's/^ts-sdk\/v//')
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Extracted version from tag: $VERSION"
          else
            # Use version from manual workflow dispatch input
            VERSION="${{ inputs.version }}"
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "Using manual version input: $VERSION"
          fi

      - name: Update package.json version
        working-directory: ./lib/ts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo "Setting TypeScript SDK package version to: $VERSION"
          # Use npm version - the native and safe way to update package.json
          npm version "$VERSION" --no-git-tag-version
          echo "Updated package.json version:"
          grep '"version":' package.json

      - name: Build TypeScript SDK
        working-directory: ./lib/ts
        run: |
          echo "🏗️ Building TypeScript SDK..."
          yarn build

      - name: Verify build artifacts
        working-directory: ./lib/ts
        run: |
          echo "✅ Verifying build artifacts..."
          ls -la dist/ | head -20

      - name: Publish to npm via OIDC Trusted Publishing
        working-directory: ./lib/ts
        run: |
          echo "🚀 Publishing to npm via OIDC Trusted Publishing..."
          echo "npm version: $(npm --version)"
          # OIDC handles authentication automatically - no tokens needed!
          # Provenance attestations are automatically generated with trusted publishing
          npm publish --access public

      - name: Success notification
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          echo ""
          echo "############################################################"
          echo "#                                                          #"
          echo "#  🎉 TypeScript SDK v$VERSION published! 🔐              #"
          echo "#                                                          #"
          echo "#  Package: @protochain/api@$VERSION                      #"
          echo "#  Registry: https://www.npmjs.com/package/@protochain/api #"
          echo "#  Provenance: ✅ Automatically generated                  #"
          echo "#  Authentication: OIDC (no long-lived tokens!)           #"
          echo "#                                                          #"
          echo "############################################################"

      - name: Create PR with version update
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BRANCH_NAME="chore/ts-sdk-npm-version-$VERSION"

          echo "📝 Creating PR to commit version $VERSION back to repository..."

          # Configure git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Create and checkout new branch
          git checkout -b "$BRANCH_NAME"

          # Add only the version change
          git add lib/ts/package.json

          # Commit the version change
          COMMIT_MSG="chore: update TypeScript SDK version to $VERSION

          After successful deployment to npm registry via OIDC.
          Tag: ts-sdk/v$VERSION

          Package: @protochain/api@$VERSION
          Registry: https://www.npmjs.com/package/@protochain/api

          🤖 Generated with [Claude Code](https://claude.ai/code)

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git commit -m "$COMMIT_MSG"

          # Push the branch
          git push origin "$BRANCH_NAME"

          # Create PR using GitHub CLI
          PR_BODY="## Summary
          Updates TypeScript SDK version to $VERSION after successful npm deployment via OIDC.

          ## Details
          - Package successfully published to npm registry using OIDC Trusted Publishing
          - Provenance attestations automatically generated
          - No long-lived tokens used (secure OIDC authentication)
          - Version updated in \`lib/ts/package.json\`
          - Triggered by tag: \`ts-sdk/v$VERSION\`

          ## Publishing Information
          - **Package**: @protochain/api@$VERSION
          - **Registry**: https://www.npmjs.com/package/@protochain/api
          - **Authentication**: OIDC Trusted Publishing (no npm tokens)

          ## Quality Checks Performed
          - ✅ TypeScript linting passed
          - ✅ Type checking passed
          - ✅ Build successful
          - ✅ Protobuf code generation successful

          ## Security
          - ✅ Published via OIDC (no npm tokens)
          - ✅ Provenance attestations included
          - ✅ Short-lived, workflow-specific credentials

          ## Next Steps
          - [ ] Review version update
          - [ ] Merge to main branch
          - [ ] Update changelog if needed

          🤖 Generated with [Claude Code](https://claude.ai/code)"

          gh pr create \
            --title "chore: update TypeScript SDK version to $VERSION" \
            --body "$PR_BODY" \
            --base main \
            --head "$BRANCH_NAME"

          echo "✅ PR created successfully!"
