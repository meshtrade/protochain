name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      proto: ${{ steps.filter.outputs.proto }}
      go: ${{ steps.filter.outputs.go }}
      rust: ${{ steps.filter.outputs.rust }}
      typescript: ${{ steps.filter.outputs.typescript }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            proto:
              - 'buf.yaml'
              - 'lib/proto/**'
              - 'lib/_code_gen/**'
              - 'scripts/code-gen/**'
            go:
              - '.golangci.yml'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - 'tool/**'
              - 'lib/go/**'
              - 'tests/go/**'
              - 'app/template/**/*.go'
              - 'scripts/lint/go.sh'
            rust:
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rustfmt.toml'
              - '.clippy.toml'
              - 'app/**/*.rs'
              - 'lib/rust/**'
              - 'scripts/lint/rs.sh'
            typescript:
              - 'package.json'
              - 'yarn.lock'
              - 'lib/ts-web/**'
              - 'tool/protoc-gen/cmd/protochain_ts_web/**'
              - 'scripts/lint/ts.sh'

  proto:
    name: Protobuf Codegen + Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.proto == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1

      - name: Validate protobuf definitions
        run: buf lint lib/proto

      - name: Generate code
        run: ./scripts/code-gen/generate/all.sh

      - name: Verify generated code is committed
        run: |
          if ! git diff --quiet; then
            echo "Generated code is out of date. Run ./scripts/code-gen/generate/all.sh and commit changes."
            git status --short
            git diff --stat
            exit 1
          fi

  go:
    name: Go Lint + Unit Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.proto == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install linters
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install golang.org/x/tools/cmd/goimports@latest

      - name: Run golangci-lint
        run: golangci-lint run --config .golangci.yml tests/go/... tool/... lib/go/...

      - name: Check goimports formatting
        run: |
          GOIMPORTS_FILES=$(find tests/go tool lib/go -type f -name '*.go' -not -name '*.pb.go' -not -name '*.passivgo.go')
          if [ -n "$GOIMPORTS_FILES" ]; then
            UNFORMATTED=$(echo "$GOIMPORTS_FILES" | xargs goimports -l)
            if [ -n "$UNFORMATTED" ]; then
              echo "Go files need goimports formatting:"
              echo "$UNFORMATTED"
              exit 1
            fi
          fi

      - name: Run Go unit tests
        run: |
          go test ./tool/...

  rust:
    name: Rust Lint + Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.proto == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Run workspace unit tests
        run: cargo test --workspace --all-features

      - name: Check generated Rust SDK crate builds
        run: cargo test --manifest-path lib/rust/Cargo.toml --all-features --lib

  typescript:
    name: TypeScript Lint + Type Checks
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.typescript == 'true' || needs.changes.outputs.proto == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build TypeScript SDK
        run: yarn workspace @protochain/ts-web build

      - name: Lint all workspaces
        run: yarn workspaces run lint

      - name: Typecheck all workspaces
        run: yarn workspaces run typecheck
