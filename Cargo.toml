[workspace]
resolver = "2"
members = [
    "app/solana/cmd/api"
]

# Exclude generated code from workspace
exclude = [
    "lib/rust"
]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Disable some overly pedantic lints
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
redundant_pub_crate = "allow"
similar_names = "allow"
too_many_lines = "allow"
# Allow multiple crate versions (common in Solana ecosystem)
multiple_crate_versions = "allow"
# Explicitly deny dangerous patterns
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"

[workspace.dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "full"] }
tonic = "0.12"
tonic-reflection = "0.12"
tonic-health = "0.12"
prost = "0.13"
async-trait = "0.1"
solana-client = "4.0.0-beta.2"
solana-sdk = "3"
# `agave-unstable-api` gates the entire solana-transaction-status crate in v4+; it is not
# covered by Agave's backward-compatibility policy, so breaking changes can land in minor/patch
# releases.  We accept that risk here because:
#   1. There is no stable alternative — solana-sdk does not expose transaction-status metadata
#      (logs, balances, compute units, encoding helpers).
#   2. Our surface is intentionally small: only `UiTransactionEncoding`, `EncodedTransaction`,
#      and `OptionSerializer` are imported.  We are not coupled to the heavier parsed-instruction
#      or account-data APIs that are most likely to churn.
#   3. The overall dependency set is already on 4.0.0-beta.x, so we are not adding instability
#      that isn't already present.
# Action on breakage: update imports; the types we use are stable-feeling encoding helpers that
# are unlikely to be removed, only potentially moved to solana-rpc-client-api in future.
solana-transaction-status = { version = "4.0.0-beta.2", features = ["agave-unstable-api"] }
solana-pubsub-client = "4.0.0-beta.2"
solana-rpc-client-api = "4.0.0-beta.2"
solana-commitment-config = "3.1.1"
serde_json = "1.0"
futures-util = "0.3"
tokio-stream = "0.1"
dashmap = "5.5"
uuid = { version = "1.0", features = ["v4"] }
tokio-tungstenite = { version = "0.23", default-features = false, features = ["rustls-tls-native-roots"] }
# Note: spl-token and spl-associated-token-account are configured
# in the app-specific Cargo.toml with entrypoint features excluded

# Structured logging dependencies
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
tracing-appender = "0.2"